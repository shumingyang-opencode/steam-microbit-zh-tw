<html>

<head>
    <title>MakeCode Multi Editor</title>
    <style>
        html, body {
            overscroll-behavior: none;
        }
        iframe {
            position: absolute;
            width: calc(50% - 0.15rem);
            height: 100%;
            bottom: 0;
            top: 0;
            border: none;
        }

        #left {
            left: 0;
            right: calc(50% - 0.15rem);
        }

        #right {
            right: 0;
            left: calc(50% + 0.15rem);
        }

        #divider {
            position: absolute;
            width: 0.3rem;
            cursor: col-resize;
            height: 100%;
            left: calc(50% - 0.15rem);
            right: calc(50% + 0.15rem);
            background: #bbb;
            top: 0rem;
        }
    </style>
    <style id="bpmf-font-static">
        @font-face {
            font-family: 'BpmfIansui';
            src: url('/fonts/BpmfIansui-Regular.ttf') format('truetype');
            font-display: swap;
        }
        html, body, .ui { font-family: 'BpmfIansui','PingFang TC','Microsoft JhengHei',sans-serif !important; }
        .blocklySvg text, .blocklyText, .blocklyTreeLabel, .blocklyFlyoutLabelText,
        .ui.button, .ui.menu .item, .ui.label, .ui.header, .ui.segment, .ui.message,
        .menuitem, .goog-menuitem { font-family: 'BpmfIansui','PingFang TC','Microsoft JhengHei',sans-serif !important; }
    </style>
</head>

<body>
    <iframe id="left" allow="usb;camera"></iframe>
    <div id="divider"></div>
    <iframe id="right" allow="usb;camera"></iframe>
    <script>
        (function () {
            // This line gets patched up by the cloud
            var pxtConfig = {
    "relprefix": "/steam-microbit-zh-tw/makecode-editor-zh-tw/",
    "verprefix": "",
    "workerjs": "/steam-microbit-zh-tw/makecode-editor-zh-tw/worker.js",
    "monacoworkerjs": "/steam-microbit-zh-tw/makecode-editor-zh-tw/monacoworker.js",
    "gifworkerjs": "/steam-microbit-zh-tw/makecode-editor-zh-tw/gifjs/gif.worker.js",
    "serviceworkerjs": "/steam-microbit-zh-tw/makecode-editor-zh-tw/serviceworker.js",
    "typeScriptWorkerJs": "/steam-microbit-zh-tw/makecode-editor-zh-tw/tsworker.js",
    "pxtVersion": "13.0.1",
    "pxtRelId": "localDirRelId",
    "pxtCdnUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/",
    "commitCdnUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/",
    "blobCdnUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/",
    "cdnUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/",
    "targetVersion": "0.0.0",
    "targetRelId": "",
    "targetUrl": "",
    "targetId": "microbit",
    "simUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/simulator.html",
    "simserviceworkerUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/simulatorserviceworker.js",
    "simworkerconfigUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/workerConfig.js",
    "partsUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/siminstructions.html",
    "runUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/run.html",
    "docsUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/docs.html",
    "multiUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/multi.html",
    "asseteditorUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/asseteditor.html",
    "isStatic": true,
    "kioskUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/kiosk.html",
    "teachertoolUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/teachertool.html",
    "tutorialtoolUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/tutorialtool.html",
    "skillmapUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/skillmap.html",
    "multiplayerUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/multiplayer.html",
    "authcodeUrl": "/steam-microbit-zh-tw/makecode-editor-zh-tw/authcode.html"
};

            var left = document.getElementById("left");
            var right = document.getElementById("right");
            var frames = [left, right]
            var divider = document.getElementById("divider");
            var localhost = window.location.hostname == "localhost";
            var editor = (pxtConfig ? pxtConfig.relprefix : '/').replace(/-*$/, '');
            var flags = "?nestededitorsim=1&editorlayout=ide&nosandbox=1&parentOrigin=" + encodeURIComponent(window.location.origin);
            var ratio = .5;
            var dividerWidth = 14;

            function updateSrc(ifrm, hash) {
                var h = hash ? "#" + hash : "";
                console.log("hash: " + h)
                if (localhost) {
                    ifrm.src = "/index.html" + flags + h;
                } else {
                    ifrm.src = editor + flags + h;
                }
            }

            function handleHash() {
                var hashLeft = ""
                var hashRight = ""
                var route = decodeURIComponent(window.location.hash || "#");

                if (route.indexOf(":|:") !== -1) {
                    var parts = route.replace(/^#/, '').split(':|:', 2);
                    updateSrc(left, parts[0]);
                    updateSrc(right, parts[1]);
                }
                else {
                    route = route.replace(/^#/, '');
                    var params = new URLSearchParams(route);
                    if (params.has("left")) {
                        updateSrc(left, params.get("left"));
                    }
                    else if (params.has("leftscript")) {
                        updateSrc(left, "pub:" + params.get("leftscript"));
                    }
                    else {
                        updateSrc(left);
                    }
                    if (params.has("right")) {
                        updateSrc(right, params.get("right"));
                    }
                    else if (params.has("rightscript")) {
                        updateSrc(right, "pub:" + params.get("rightscript"));
                    }
                    else {
                        updateSrc(right);
                    }
                }

                window.history.replaceState('', '', '#')
            }
            function handleMessage(msg) {
                var data = msg.data;
                var source = msg.source;
                if (!!data.broadcast) {
                    data.outer = true;
                    frames.filter(function (ifrm) {
                            return ifrm.contentWindow !== source;
                        })
                        .forEach(function (ifrm) {
                            ifrm.contentWindow.postMessage(data, window.location.origin)
                        });
                }
            }
            function setWidths() {
                var t = document.body.clientWidth;
                var n = Math.floor(t * ratio);
                var i = Math.max(t - n - dividerWidth, 4);
                left.style.width = n + "px";
                divider.style.left = n + "px";
                divider.style.width = dividerWidth + "px";
                right.style.left = n + dividerWidth + "px";
                right.style.width = i + "px";
            }
            function startDrag() {
                left.style.visibility = "hidden";
                right.style.visibility = "hidden";
                var n = divider.onmouseover;
                var t = divider.onmouseout;
                divider.onmouseover = null;
                divider.onmouseout = null;
                document.body.onmousemove = function (n) {
                    n || (n = window.event);
                    ratio = (n.clientX - dividerWidth / 2) / document.body.clientWidth;
                    ratio < .1 && (ratio = .1);
                    ratio > .9 && (ratio = .9);
                    setWidths();
                }
                document.body.onmouseup = function () {
                    document.body.onmousemove = null;
                    document.body.onmouseup = null;
                    left.style.visibility = "inherit";
                    right.style.visibility = "inherit";
                    divider.onmouseover = n;
                    divider.onmouseout = t;
                }
            }
            window.onresize = setWidths;
            window.onhashchange = handleHash;
            window.onmessage = handleMessage;

            divider.onmouseover = function () {
                document.body.style.cursor = "w-resize";
                divider.onmousedown = startDrag;
            }
            divider.onmouseout = function () {
                document.body.style.cursor = "default";
                divider.onmousedown = null;
            }
            setWidths();
            handleHash();
        })();
    </script>
    <!-- @include tracking.html -->
</body>

</html>
