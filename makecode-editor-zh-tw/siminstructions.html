<!doctype html>

    <title>Make Instructions</title>
    <style type="text/css">
        @import "/semantic.css";

    <style>
        html {
            padding: 0;
            margin: 0;
        }

        body {
            position: relative;
            width: 100%;
            height: 100%;            
            padding: 0;
            margin: 0;
            font-family: "Lucida Console", Monaco, monospace;
        }

        div {
            /*undo semantic UI*/
            box-sizing: content-box;
            line-height: normal;
        }

        img {
            border: 0;
        }

        .organization {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            height: 4rem;
        }

        h1 {
            font-size: 2em;
            font-weight: normal;
            color: rgba(0, 0, 0, 0.87);
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, Helvetica, sans-serif;
            display: block;
            text-align: center;
        }

        #front-panel .board-svg {
            position: absolute;
            left: 2rem;
            width: 300px;
            top: 16rem;
        }

        #proj-title {
            width: 100%;
            font-size: 55px;
            margin-top: 20px;
        }

        #proj-code {
            width: 300px;
            height: 400px;
            position: absolute;
            right: 2rem;
            top: 16rem;
        }

        #proj-code-container {
            width: 100%;
            height: 100%;
            font-size: 4px;
            overflow: hidden;
            display: none;
        }

        #proj-code-spinner {
            width: 100%;
        }

        .back-panel svg {
            position: relative;
            margin: 0 auto;
            left: inherit;
            bottom: -7px;
        }
    </style>
    <style id="bpmf-font-static">
        @font-face {
            font-family: 'BpmfIansui';
            src: url('/fonts/BpmfIansui-Regular.ttf') format('truetype');
            font-display: swap;
        }
        html, body, .ui { font-family: 'BpmfIansui','PingFang TC','Microsoft JhengHei',sans-serif !important; }
        .blocklySvg text, .blocklyText, .blocklyTreeLabel, .blocklyFlyoutLabelText,
        .ui.button, .ui.menu .item, .ui.label, .ui.header, .ui.segment, .ui.message,
        .menuitem, .goog-menuitem { font-family: 'BpmfIansui','PingFang TC','Microsoft JhengHei',sans-serif !important; }
    </style>
</head>
