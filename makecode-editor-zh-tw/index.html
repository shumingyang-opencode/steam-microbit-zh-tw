                "{font-family:'BpmfIansui','PingFang TC','Microsoft JhengHei',sans-serif !important;}";
            function inject() {
                if (document.getElementById('bpmf-font-late')) return;
                var st = document.createElement('style');
                st.id = 'bpmf-font-late';
                st.textContent = css;
                (document.body || document.documentElement).appendChild(st);
            }
            if (document.readyState === 'complete') inject();
            else window.addEventListener('load', inject);
            [500, 1500, 3000, 6000].forEach(function (t) { setTimeout(inject, t); });
        })();
